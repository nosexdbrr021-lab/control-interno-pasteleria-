<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Control pasteleria</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0B0914">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap">

<style>
:root {
  --bg: #0B0914;
  --card: #151226;
  --card-border: #231E3D;
  --purple-grad: linear-gradient(135deg, #5B21B6 0%, #7C3AED 100%);
  --tx: #F3F4F6;
  --mu: #9CA3AF;
  --ok: #10B981;
  --no: #EF4444;
  --accent: #A855F7;
  --chx: #1C1733;
  --rs: #2A1A2E;
  box-sizing: border-box;
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  width: 100%;
  height: 100%;
  height: 100dvh;
  margin: 0;
  padding: 0;
  overflow: hidden;
  background: var(--bg);
  color: var(--tx);
  font: 14px/1.4 "DM Sans", -apple-system, sans-serif;
}

.app-viewport {
  display: flex;
  flex-direction: column;
  height: 100dvh;
  padding-top: env(safe-area-inset-top, 0px);
}

.app-header {
  padding: 12px 16px 8px;
  flex: none;
  background: var(--bg);
  border-bottom: 1px solid var(--card-border);
}

.app-header h1 {
  font-size: 22px;
  font-weight: 700;
  margin: 0;
  color: #fff;
}

.sub {
  color: var(--mu);
  font-size: 12px;
  margin: 2px 0 0;
}

main {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 14px 12px 20px;
}

.card {
  background: var(--card);
  border: 1px solid var(--card-border);
  border-radius: 14px;
  padding: 14px;
  margin-bottom: 14px;
}

.card h3 {
  font-size: 16px;
  margin: 0 0 10px;
  color: #fff;
}

.hero {
  background: var(--purple-grad);
  border-radius: 16px;
  padding: 18px;
  margin-bottom: 14px;
  color: #fff;
  box-shadow: 0 8px 20px -4px rgba(124, 58, 237, 0.4);
}

.hero span { opacity: 0.85; font-size: 13px; }
.hero b { display: block; font-size: 34px; margin: 2px 0 6px; }
.hero small { opacity: 0.75; font-size: 11px; }

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
  gap: 10px;
  margin-bottom: 14px;
}

.k {
  background: var(--card);
  border: 1px solid var(--card-border);
  border-radius: 12px;
  padding: 12px;
}

.k span { color: var(--mu); font-size: 11px; display: block; }
.k b { display: block; font-size: 18px; color: #fff; margin-top: 2px; }

.pos { color: var(--ok) !important; }
.neg { color: var(--no) !important; }

.tw { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { padding: 8px 6px; text-align: right; border-bottom: 1px solid var(--card-border); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
th { color: var(--mu); font-weight: 500; font-size: 12px; }
tfoot td { font-weight: 700; background: var(--chx); }

form.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end; }
label { display: flex; flex-direction: column; font-size: 12px; color: var(--mu); gap: 2px; flex: 1; min-width: 110px; }
input, select, textarea {
  font: inherit;
  color: #fff;
  background: #0B0914;
  border: 1px solid var(--card-border);
  border-radius: 8px;
  padding: 8px 10px;
  width: 100%;
}

button.p, button.s, button.dg {
  font: inherit;
  font-weight: 600;
  border-radius: 8px;
  padding: 9px 14px;
  cursor: pointer;
  border: 0;
}
button.p { background: var(--accent); color: #fff; }
button.s { background: var(--card-border); color: var(--tx); }
button.dg { background: rgba(239, 68, 68, 0.2); color: var(--no); }
button.l { background: none; border: 0; color: var(--accent); cursor: pointer; padding: 2px 4px; font-size: 12px; }
button.x { background: none; border: 0; color: var(--mu); cursor: pointer; font-size: 16px; }

.pl { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
.pc {
  background: var(--card);
  border: 1px solid var(--card-border);
  border-radius: 12px;
  padding: 12px;
  text-align: left;
  cursor: pointer;
  color: var(--tx);
}
.pc h3 { font-size: 15px; margin: 4px 0 2px; }
.pc small { color: var(--mu); display: block; font-size: 11px; }
.pc em { font-style: normal; color: var(--accent); font-weight: 700; font-size: 15px; }

dialog {
  border: 1px solid var(--card-border);
  border-radius: 14px;
  background: var(--card);
  color: var(--tx);
  width: min(90vw, 500px);
  padding: 16px;
}
dialog::backdrop { background: rgba(0,0,0,0.7); }
.dh { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }

.bottom-nav {
  flex: none;
  height: 65px;
  background: rgba(21, 18, 38, 0.96);
  backdrop-filter: blur(10px);
  border-top: 1px solid var(--card-border);
  display: flex;
  overflow-x: auto;
  align-items: center;
  padding-bottom: env(safe-area-inset-bottom, 0px);
}

.nav-item {
  background: none;
  border: 0;
  color: var(--mu);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  font-size: 10px;
  padding: 4px 8px;
  cursor: pointer;
  flex: 1;
  min-width: 60px;
  white-space: nowrap;
}

.nav-item.active { color: #fff; font-weight: 700; }
.nav-item.active .nav-icon { background: rgba(168, 85, 247, 0.25); color: var(--accent); }
.nav-icon { width: 32px; height: 22px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 13px; }

.ph { display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 8px; background: var(--chx); }
.nm { display: inline-flex; align-items: center; gap: 8px; }
.empty { color: var(--mu); padding: 10px 0; text-align: center; }
</style>
</head>
<body>

<div class="app-viewport">
  <div class="app-header">
    <h1 id="hdr-title">Belu Pastelería</h1>
    <p class="sub" id="hdr-sub">Cargando...</p>
  </div>

  <main id="main"></main>

  <nav class="bottom-nav" id="nav"></nav>
</div>

<dialog id="dlg"></dialog>

<script>
const KEY='dulcecuenta_v1', U={g:[1,'g'],kg:[1000,'g'],ml:[1,'ml'],L:[1000,'ml'],un:[1,'un']};
const $=s=>document.querySelector(s), dlg=$('#dlg');
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=()=>new Date().toISOString().slice(0,10);
const dd=o=>new Date(Date.now()-o*864e5).toISOString().slice(0,10);
const fd8=f=>f.split('-').reverse().join('/');
const mesN=k=>new Date(k+'-15').toLocaleDateString('es-PE',{month:'short',year:'2-digit'});

let S;
try{ S=JSON.parse(localStorage.getItem(KEY)) }catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const m=n=>S.cfg.mon+' '+(+n).toFixed(2);
const ins=id=>S.ins.find(i=>i.id===id);
const cb=i=>i.precio/(i.c*U[i.u][0]);
const cls=n=>n<0?'neg':'pos';

const EM=[[/tres leches|torta|keke|cake/i,'🍰'],[/leche/i,'🥛'],[/huevo/i,'🥚'],[/az[uú]car/i,'🍬'],[/harina/i,'🌾'],[/mantequilla/i,'🧈'],[/vainilla/i,'🌼'],[/polvo/i,'🧂'],[/crema|flan/i,'🍮']];
const th=(o,c='')=>`<span class="ph ${c}">${(EM.find(([x])=>x.test(o.n))||[0,'🧁'])[1]}</span>`;
const nm=(o,t,c)=>`<span class="nm">${th(o,c)}${t}</span>`;
const pp=id=>S.pos.find(p=>p.id===id)||{n:'(eliminado)'};
const gp=n=>n<0?'Pérdida':'Ganancia';

const mdif=(a,b)=>(+a.slice(0,4)-+b.slice(0,4))*12+(+a.slice(5)-+b.slice(5));
const dep=k=>S.inv.reduce((a,x)=>{const v=x.vu||36,q=x.m/v,n=mdif(k||today().slice(0,7),x.f.slice(0,7));return a+(k?(n>=0&&n<v?q:0):Math.min(v,Math.max(0,n+1))*q)},0);
const R=(f,k)=>{const t=tot(f),g=S.gas.filter(f).reduce((a,x)=>a+x.m,0),mer=S.mer.filter(f).reduce((a,x)=>a+x.cos,0),d=dep(k);return{...t,gas:g,mer,dep:d,iv:invS(f),net:t.gan-mer-g-d}};

function calc(p){
  const insumos=p.ings.reduce((a,r)=>{const i=ins(r.i);return a+(i?cb(i)*r.c:0)},0);
  const total=insumos+ +p.otros+p.porc*p.emp, porc=total/p.porc;
  const ideal=Math.ceil(porc*(1+p.mar/100)*10-1e-9)/10, precio=p.precio>0?p.precio:ideal;
  return{insumos,total,porc,ideal,precio,gan:precio-porc};
}

function seed(){
  const I=(n,c,u,precio)=>({id:uid(),n,c,u,precio});
  const li=[I('Leche evaporada',400,'g',4.5),I('Leche condensada',393,'g',6.5),I('Leche fresca',1,'L',4.8),I('Huevos',30,'un',15),I('Azúcar',1,'kg',4.2),I('Harina',1,'kg',4),I('Mantequilla',200,'g',8)];
  const g=n=>li.find(i=>i.n===n).id;
  const P=(n,porc,l,pasos,precio)=>({id:uid(),n,porc,ings:l.map(([x,c])=>({i:g(x),c})),pasos,emp:.3,otros:2,mar:100,precio:0});
  const po=[P('Crema volteada',8,[['Huevos',6],['Leche evaporada',400],['Leche condensada',393],['Azúcar',150]],'Mezclar y hornear.',5.5)];
  S={cfg:{mon:'S/',cap:3000,mar:100},ins:li,pos:po,ven:[],inv:[],gas:[]};
  save();
}

if(!S)seed();
S.gas=S.gas||[]; S.cfg.mar=S.cfg.mar||100; S.pun=S.pun||[]; S.sal=S.sal||[]; S.mer=S.mer||[]; S.ped=S.ped||[]; S.inv=S.inv||[];

let ui={tab:'panel',mes:today().slice(0,7),sim:{},eIns:null};
const T=[
  ['panel','Panel','🏠'],
  ['insumos','Insumos','🌾'],
  ['postres','Postres','🧁'],
  ['costos','Costos','💰'],
  ['ventas','Ventas','💳'],
  ['vit','Vitrina','🏪'],
  ['ped','Pedidos','📋'],
  ['comp','Compras','🛒'],
  ['inv','Equipos','⚙️'],
  ['gas','Gastos','💸']
];

const tot=f=>{let i=0,c=0;S.ven.filter(f).forEach(v=>{i+=v.c*v.pr;c+=v.c*v.cu});return{ing:i,cos:c,gan:i-c}};
const invS=f=>S.inv.filter(f).reduce((a,x)=>a+x.m,0);

const V={};
V.panel=()=>{
  const t=tot(()=>1), r=R(()=>1), cap=S.cfg.cap+r.net;
  return `
  <div class="hero"><span>Capital Actual</span><b>${m(cap)}</b><small>Caja estimada ${m(S.cfg.cap+r.net+r.dep-r.iv)}</small></div>
  <div class="grid">
   <div class="k"><span>Ventas Total</span><b>${m(t.ing)}</b></div>
   <div class="k"><span>Gasto Insumos</span><b>${m(t.cos)}</b></div>
   <div class="k"><span>Gastos Generales</span><b>${m(r.gas)}</b></div>
   <div class="k"><span>${gp(r.net)} Neta</span><b class="${cls(r.net)}">${m(Math.abs(r.net))}</b></div>
  </div>`;
};

V.insumos=()=>{
  const e=S.ins.find(i=>i.id===ui.eIns)||{id:'',n:'',c:'',u:'g',precio:''};
  return `
  <div class="card"><h3>${e.id?'Editar Insumo':'Nuevo Insumo'}</h3>
  <form class="row" data-f="ins"><input type="hidden" name="id" value="${e.id}">
   <label style="flex:2">Nombre<input name="n" value="${esc(e.n)}" required></label>
   <label>Cantidad<input name="c" type="number" step="any" value="${e.c}" required></label>
   <label>Unidad<select name="u">${Object.keys(U).map(u=>`<option ${u===e.u?'selected':''}>${u}</option>`).join('')}</select></label>
   <label>Precio<input name="p" type="number" step="any" value="${e.precio}" required></label>
   <button class="p">${e.id?'Guardar':'Agregar'}</button>
  </form></div>
  <div class="card tw"><table><thead><tr><th>Insumo</th><th>Precio</th><th>Costo/Unidad</th><th></th></tr></thead><tbody>
  ${S.ins.map(i=>`<tr><td>${nm(i,esc(i.n))}</td><td>${m(i.precio)}</td><td>${S.cfg.mon}${cb(i).toFixed(3)}</td><td><button class="l" data-a="editIns" data-id="${i.id}">Edit</button><button class="l" data-a="delIns" data-id="${i.id}">X</button></td></tr>`).join('')}
  </tbody></table></div>`;
};

V.postres=()=>`
  <div class="pl">${S.pos.map(p=>{const c=calc(p);return`<button class="pc"><span class="nm">${th(p)}<h3>${esc(p.n)}</h3></span><small>${p.porc} porciones</small><em>${m(c.precio)}</em></button>`}).join('')}</div>`;

V.costos=()=>{
  const r=S.pos.map(p=>({p,c:calc(p)}));
  return `<div class="card tw"><table><thead><tr><th>Postre</th><th>Costo/Porción</th><th>Precio Venta</th><th>Ganancia</th></tr></thead><tbody>
  ${r.map(({p,c})=>`<tr><td>${nm(p,esc(p.n))}</td><td>${m(c.porc)}</td><td><b>${m(c.precio)}</b></td><td class="${cls(c.gan)}">${m(c.gan)}</td></tr>`).join('')}
  </tbody></table></div>`;
};

V.ventas=()=>{
  const p0=S.pos[0], v=[...S.ven].reverse();
  return `<div class="card"><h3>Nueva Venta</h3>${p0?`<form class="row" data-f="ven">
   <label style="flex:2">Postre<select name="p">${S.pos.map(p=>`<option value="${p.id}">${esc(p.n)}</option>`).join('')}</select></label>
   <label>Cantidad<input name="c" type="number" value="1" required></label>
   <label>Precio<input name="pr" type="number" step="any" value="${calc(p0).precio.toFixed(2)}" required></label>
   <button class="p">Registrar</button></form>`:'<p class="empty">Agrega postres primero.</p>'}</div>
  <div class="card tw"><table><thead><tr><th>Postre</th><th>Cant.</th><th>Total</th><th></th></tr></thead><tbody>
  ${v.map(x=>`<tr><td>${nm(pp(x.p),esc(pp(x.p).n))}</td><td>${x.c}</td><td>${m(x.c*x.pr)}</td><td><button class="l" data-a="delVen" data-id="${x.id}">X</button></td></tr>`).join('')}
  </tbody></table></div>`;
};

V.vit=()=>`<div class="card"><h3>Envíos a Vitrina</h3><p class="mu">Administra tus puntos de venta minimarket.</p></div>`;
V.ped=()=>`<div class="card"><h3>Pedidos Especiales</h3><p class="mu">Cotiza y agenda tortas bajo pedido.</p></div>`;
V.comp=()=>`<div class="card"><h3>Lista de Compras</h3><p class="mu">Insumos proyectados para la semana.</p></div>`;
V.inv=()=>`<div class="card"><h3>Equipos e Inversiones</h3><p class="mu">Activos y maquinaria de tu negocio.</p></div>`;
V.gas=()=>`<div class="card"><h3>Gastos Generales</h3><p class="mu">Alquiler, servicios y costos fijos.</p></div>`;

function render(){
  const tabActual = T.find(t=>t[0]===ui.tab)||T[0];
  $('#hdr-title').textContent = tabActual[1];
  $('#hdr-sub').textContent = 'Belu Pastelería';

  $('#nav').innerHTML = T.map(([k,t,ic])=>`
    <button class="nav-item ${ui.tab===k?'active':''}" data-t="${k}">
      <div class="nav-icon">${ic}</div>
      <span>${t}</span>
    </button>
  `).join('');

  $('#main').innerHTML = (V[ui.tab]||V.panel)();
}

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-t]'); if(t){ui.tab=t.dataset.t; render(); return;}
  const a=e.target.closest('[data-a]'); if(!a)return;
  const act=a.dataset.a, id=a.dataset.id;
  if(act==='editIns'){ui.eIns=id; render();}
  else if(act==='delIns'){S.ins=S.ins.filter(i=>i.id!==id); save(); render();}
  else if(act==='delVen'){S.ven=S.ven.filter(v=>v.id!==id); save(); render();}
});

document.addEventListener('submit',e=>{
  const f=e.target.closest('[data-f]'); if(!f)return;
  e.preventDefault();
  const d=Object.fromEntries(new FormData(f)), k=f.dataset.f;
  if(k==='ins'){
    if(d.id){const i=ins(d.id); i.n=d.n; i.c=+d.c; i.u=d.u; i.precio=+d.p; ui.eIns=null;}
    else{S.ins.push({id:uid(),n:d.n,c:+d.c,u:d.u,precio:+d.p});}
    save(); render();
  }
  else if(k==='ven'){
    S.ven.push({id:uid(),f:today(),p:d.p,c:+d.c,pr:+d.pr,cu:calc(S.pos.find(x=>x.id===d.p)).porc});
    save(); render();
  }
});

function guardarSesionActiva(){
  localStorage.setItem('usuarioLogueado','true');
}

window.addEventListener('DOMContentLoaded', () => {
  guardarSesionActiva();
  render();
});
</script>
</body>
</html>
