<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Belu Pastelería</title>

<!-- Agregado para PWA / Pantalla Completa -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1A1114">

<!-- Agregado para exportar a PDF -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=DM+Sans:wght@400;500;700&display=swap">
<style>
:root{--bg:#F9F5F0;--card:#fff;--ch:#2A1A1E;--chx:#F3EAE2;--ro:#8E3A52;--rs:#F5E6E9;--ln:#E6DACF;--tx:#2A1A1E;--mu:#7C6B66;--ok:#2F7D5B;--no:#B3382C;--au:#B8935A;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1A1114;--card:#261A1E;--ch:#EBDCD2;--chx:#33252A;--ro:#D98BA3;--rs:#432733;--ln:#3F2F33;--tx:#F5ECE7;--mu:#B8A5A0;--ok:#6FCF9F;--no:#F08A7E;--au:#D4B27A}}
:root[data-theme=dark]{--bg:#1A1114;--card:#261A1E;--ch:#EBDCD2;--chx:#33252A;--ro:#D98BA3;--rs:#432733;--ln:#3F2F33;--tx:#F5ECE7;--mu:#B8A5A0;--ok:#6FCF9F;--no:#F08A7E;--au:#D4B27A}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 "DM Sans",system-ui,sans-serif}
h1,h2,h3{font-family:"Cormorant Garamond",Georgia,serif;margin:0;color:var(--ch)}
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
aside{background:var(--ch);padding:26px 16px;position:sticky;top:0;height:100vh}
aside h1{color:var(--bg);font-size:46px;font-style:italic;line-height:1;padding:0 10px}aside p.br{color:var(--au);opacity:1;letter-spacing:.34em;font-size:12px;margin:4px 10px 8px}
aside p{color:var(--bg);opacity:.65;margin:0 10px 22px;font-size:13px}
#nav{display:flex;flex-direction:column;gap:2px}
#nav button{background:none;border:0;color:var(--bg);opacity:.75;text-align:left;padding:10px 12px;border-radius:8px;font:inherit;cursor:pointer}
#nav button:hover{opacity:1;background:#ffffff14}
#nav button.on{background:var(--ro);color:#fff;opacity:1;font-weight:700}
main{padding:30px clamp(16px,4vw,44px);max-width:1100px;width:100%}
main>h2{font-size:38px;margin-bottom:4px}main>h2:after{content:"";display:block;width:44px;height:2px;background:var(--au);margin-top:6px}
.sub{color:var(--mu);margin:0 0 22px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:18px;margin-bottom:18px}
.card h3{font-size:18px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:18px}
.k{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:14px 16px}
.k span{color:var(--mu);font-size:13px}.k b{display:block;font-size:28px;font-family:"Cormorant Garamond",Georgia,serif;color:var(--ch);margin-top:2px}
.pos{color:var(--ok)!important}.neg{color:var(--no)!important}
.hero{background:var(--ch);color:var(--bg);border-radius:14px;padding:26px;margin-bottom:18px}
.hero span{opacity:.75}.hero b{display:block;font:700 58px "Cormorant Garamond",Georgia,serif;margin:2px 0 6px}
.hero small{opacity:.7}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:9px 10px;text-align:right;border-bottom:1px solid var(--ln);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--mu);font-weight:500;font-size:13px}
tfoot td{font-weight:700;border-bottom:0;background:var(--chx)}
form.row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
label{display:flex;flex-direction:column;font-size:13px;color:var(--mu);gap:3px;flex:1;min-width:120px}
input,select,textarea{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--ln);border-radius:8px;padding:8px 10px;width:100%}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--ro);outline-offset:1px}
button.p,button.s,button.dg{font:inherit;font-weight:500;border-radius:8px;padding:9px 16px;cursor:pointer;border:1px solid var(--ro)}
button.p{background:var(--ro);color:#fff}
button.s{background:none;color:var(--ro)}
button.dg{background:none;color:var(--no);border-color:var(--no)}
button.l{background:none;border:0;color:var(--ro);cursor:pointer;font:inherit;padding:2px 6px}
button.x{background:none;border:0;color:var(--mu);cursor:pointer;font-size:16px;padding:4px 8px}
.pl{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.pc{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:16px;text-align:left;cursor:pointer;font:inherit;color:var(--tx)}
.pc:hover{border-color:var(--ro)}
.pc h3{font-size:19px;margin-bottom:6px}.pc small{color:var(--mu);display:block}
.pc em{font-style:normal;color:var(--ro);font-weight:700;font-size:18px}
.mu{color:var(--mu)}
dialog{border:1px solid var(--ln);border-radius:14px;background:var(--card);color:var(--tx);width:min(640px,94vw);max-height:90vh;padding:22px}
dialog::backdrop{background:#0008}
.dh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
dialog h3{margin:16px 0 6px;font-size:16px}
dialog ol{padding-left:20px;margin:0}dialog li{margin-bottom:5px}
.sum{background:var(--rs);border-radius:10px;padding:12px 14px;margin-top:14px;display:grid;grid-template-columns:1fr auto;gap:3px 16px}
.sum b:nth-child(even){text-align:right}
.act{display:flex;gap:10px;margin-top:16px;justify-content:flex-end}
.ir{display:flex;gap:8px;margin-bottom:8px;align-items:center}.ir select{flex:2}.ir input{flex:1}
.bars-w{display:flex;gap:16px;align-items:flex-end;height:170px;padding-top:6px}
.bc{flex:1;display:flex;flex-direction:column;align-items:center;height:100%;justify-content:flex-end;gap:6px}
.bars{display:flex;gap:4px;align-items:flex-end;height:100%;width:100%;justify-content:center}
.bars i{width:min(26px,40%);border-radius:4px 4px 0 0;min-height:2px}
.b1{background:var(--ro)}.b2{background:var(--ch)}
.bc span{font-size:12px;color:var(--mu)}
.lg{font-size:13px;color:var(--mu);display:flex;gap:14px;margin-top:10px}.lg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px}
.empty{color:var(--mu);padding:14px 0}
@media(max-width:760px){.app{grid-template-columns:1fr}aside{position:static;height:auto;padding:14px 10px}aside p:not(.br){display:none}#nav{flex-direction:row;overflow-x:auto}#nav button{white-space:nowrap}.hero b{font-size:34px}}
.card,.k,.pc{box-shadow:0 1px 2px #2a1a1e0d,0 8px 20px #2a1a1e0a}
.hero{border-top:3px solid var(--au)}
.ph{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:10px;background:var(--chx);font-size:19px;overflow:hidden;flex:none}
.ph img{width:100%;height:100%;object-fit:cover}.ph.lg{width:60px;height:60px;font-size:28px;border-radius:12px}
.nm{display:inline-flex;align-items:center;gap:10px;text-align:left}
.er td{padding:9px 10px}.er .t td{font-weight:700;background:var(--chx)}
input[type=file]{padding:6px}
</style>
</head>
<body>
<div class="app">
<aside><h1>Belu</h1><p class="br">Pastelería</p><p>Costos, ventas y capital en un solo lugar</p><nav id="nav"></nav></aside>
<main id="main"></main>
</div>
<dialog id="dlg"></dialog>
<script>
const KEY='dulcecuenta_v1',U={g:[1,'g'],kg:[1000,'g'],ml:[1,'ml'],L:[1000,'ml'],un:[1,'un']};
const $=s=>document.querySelector(s),dlg=$('#dlg');
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=()=>new Date().toISOString().slice(0,10);
const dd=o=>new Date(Date.now()-o*864e5).toISOString().slice(0,10);
const fd8=f=>f.split('-').reverse().join('/');
const mesN=k=>new Date(k+'-15').toLocaleDateString('es-PE',{month:'short',year:'2-digit'});
let S;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const m=n=>S.cfg.mon+' '+(+n).toFixed(2);
const ins=id=>S.ins.find(i=>i.id===id);
const cb=i=>i.precio/(i.c*U[i.u][0]);
const cls=n=>n<0?'neg':'pos';
const EM=[[/tres leches|torta|keke|cake/i,'🍰'],[/leche/i,'🥛'],[/huevo/i,'🥚'],[/az[uú]car/i,'🍬'],[/harina/i,'🌾'],[/mantequilla/i,'🧈'],[/vainilla/i,'🌼'],[/polvo/i,'🧂'],[/crema|flan/i,'🍮'],[/vitrina/i,'🗄️'],[/enfriador|refri|congel/i,'❄️'],[/batidora|licuadora|horno/i,'🥣']];
const th=(o,c='')=>`<span class="ph ${c}">${o.img?`<img src="${o.img}" alt="">`:(EM.find(([x])=>x.test(o.n))||[0,'🧁'])[1]}</span>`;
const nm=(o,t,c)=>`<span class="nm">${th(o,c)}${t}</span>`;
const pp=id=>S.pos.find(p=>p.id===id)||{n:'(eliminado)'};
const gp=n=>n<0?'Pérdida':'Ganancia';
const mdif=(a,b)=>(+a.slice(0,4)-+b.slice(0,4))*12+(+a.slice(5)-+b.slice(5));
const dep=k=>S.inv.reduce((a,x)=>{const v=x.vu||36,q=x.m/v,n=mdif(k||today().slice(0,7),x.f.slice(0,7));return a+(k?(n>=0&&n<v?q:0):Math.min(v,Math.max(0,n+1))*q)},0);
const R=(f,k)=>{const t=tot(f),g=S.gas.filter(f).reduce((a,x)=>a+x.m,0),mer=S.mer.filter(f).reduce((a,x)=>a+x.cos,0),com=S.ven.filter(f).reduce((a,v)=>a+v.c*(v.com||0),0),d=dep(k);return{...t,gas:g,mer,com,dep:d,iv:invS(f),net:t.gan-mer-g-d}};
const edr=r=>`<table class="er"><tbody><tr><td>Ingresos por ventas (vitrina ya sin comisión)</td><td>${m(r.ing)}</td></tr><tr><td>(−) Gasto en insumos</td><td>${m(r.cos)}</td></tr><tr><td>(−) Mermas de vitrina</td><td>${m(r.mer)}</td></tr><tr class="t"><td>Utilidad bruta</td><td class="${cls(r.gan-r.mer)}">${m(r.gan-r.mer)}</td></tr><tr><td>(−) Gastos generales</td><td>${m(r.gas)}</td></tr><tr class="t"><td>Utilidad operativa</td><td class="${cls(r.gan-r.mer-r.gas)}">${m(r.gan-r.mer-r.gas)}</td></tr><tr><td>(−) Depreciación de equipos</td><td>${m(r.dep)}</td></tr><tr class="t"><td>Resultado neto: ${gp(r.net)}</td><td class="${cls(r.net)}">${m(Math.abs(r.net))}</td></tr><tr><td class="mu">Equipos pagados (solo caja, no resta a la ganancia)</td><td class="mu">${m(r.iv)}</td></tr></tbody></table>`;
function calc(p){
  const insumos=p.ings.reduce((a,r)=>{const i=ins(r.i);return a+(i?cb(i)*r.c:0)},0);
  const total=insumos+ +p.otros+p.porc*p.emp,porc=total/p.porc;
  const ideal=Math.ceil(porc*(1+p.mar/100)*10-1e-9)/10,precio=p.precio>0?p.precio:ideal;
  return{insumos,total,porc,ideal,precio,gan:precio-porc};
}
function seed(){
  const I=(n,c,u,precio)=>({id:uid(),n,c,u,precio});
  const li=[I('Leche evaporada',400,'g',4.5),I('Leche condensada',393,'g',6.5),I('Leche fresca',1,'L',4.8),I('Huevos',30,'un',15),I('Azúcar',1,'kg',4.2),I('Harina',1,'kg',4),I('Mantequilla',200,'g',8),I('Esencia de vainilla',120,'ml',6),I('Polvo de hornear',100,'g',5)];
  const g=n=>li.find(i=>i.n===n).id;
  const P=(n,porc,l,pasos,precio)=>({id:uid(),n,porc,ings:l.map(([x,c])=>({i:g(x),c})),pasos,emp:.3,otros:2,mar:100,precio:0});
  const po=[
    P('Crema volteada',8,[['Huevos',6],['Leche evaporada',400],['Leche condensada',393],['Leche fresca',250],['Azúcar',150],['Esencia de vainilla',5]],'Haz el caramelo con el azúcar y viértelo en el molde.\nLicúa huevos, leches y vainilla.\nVierte la mezcla sobre el caramelo.\nCocina a baño maría 50 minutos.\nEnfría y refrigera 4 horas antes de voltear.',5.5),
    P('Tres leches',10,[['Huevos',6],['Harina',200],['Azúcar',200],['Leche evaporada',400],['Leche condensada',393],['Leche fresca',250],['Polvo de hornear',8],['Esencia de vainilla',5]],'Bate huevos con azúcar hasta que dupliquen su volumen.\nIncorpora harina y polvo de hornear.\nHornea a 180 °C por 30 minutos.\nMezcla las tres leches y báñalo ya frío.\nRefrigera 3 horas y decora.',4.5),
    P('Keke',10,[['Harina',300],['Azúcar',200],['Huevos',4],['Mantequilla',150],['Leche fresca',150],['Polvo de hornear',10],['Esencia de vainilla',5]],'Bate la mantequilla con el azúcar.\nAgrega los huevos uno a uno.\nIncorpora harina, polvo de hornear y leche.\nHornea a 180 °C por 40 minutos.',2.5)];
  S={cfg:{mon:'S/',cap:3000,mar:100},ins:li,pos:po,ven:[],inv:[],gas:[]};
  [[2,0,5],[2,1,4],[1,2,6],[5,0,3],[8,1,6],[12,2,8],[40,0,4]].forEach(([o,k,c])=>{const p=po[k],x=calc(p);S.ven.push({id:uid(),f:dd(o),p:p.id,c,pr:x.precio,cu:x.porc})});
  [[30,'Vitrina exhibidora',850],[20,'Enfriador',1200],[10,'Batidora',320]].forEach(([o,n,mo])=>S.inv.push({id:uid(),f:dd(o),n,m:mo}));
  [[25,'Alquiler del local',400],[12,'Luz y agua',90]].forEach(([o,n,mo])=>S.gas.push({id:uid(),f:dd(o),n,m:mo}));
  save();
}
if(!S)seed();
S.gas=S.gas||[];S.cfg.mar=S.cfg.mar||100;S.pos.forEach(p=>p.precio=0);
S.pun=S.pun||[];S.sal=S.sal||[];S.mer=S.mer||[];S.ped=S.ped||[];S.cfg.tar=S.cfg.tar??8;S.cfg.mp=S.cfg.mp??40;S.gas.forEach(x=>x.tipo=x.tipo||'FIJO');S.inv.forEach(x=>x.vu=x.vu||36);
let ui={tab:'panel',mes:today().slice(0,7),sim:{},eIns:null};
const T=[['panel','Panel'],['insumos','Insumos'],['postres','Postres'],['costos','Costos'],['ventas','Ventas'],['vit','Vitrina'],['ped','Pedidos'],['comp','Compras'],['inv','Inversiones'],['gas','Gastos generales'],['res','Resumen mensual']];
const tot=f=>{let i=0,c=0;S.ven.filter(f).forEach(v=>{i+=v.c*v.pr;c+=v.c*v.cu});return{ing:i,cos:c,gan:i-c}};
const invS=f=>S.inv.filter(f).reduce((a,x)=>a+x.m,0);
const pn=id=>(S.pos.find(p=>p.id===id)||{n:'(eliminado)'}).n;
const head=(t,s)=>`<h2>${t}</h2><p class="sub">${s}</p>`;
const V={};
V.panel=()=>{
  const t=tot(()=>1),r=R(()=>1),iv=r.iv,cap=S.cfg.cap+r.net;
  const ms=[...new Set([...S.ven.map(v=>v.f.slice(0,7)),...S.inv.map(x=>x.f.slice(0,7))])].sort().slice(-6);
  const rows=ms.map(k=>({k,i:tot(v=>v.f.startsWith(k)).ing,g:(q=>q.cos+q.mer+q.gas+q.dep)(R(v=>v.f.startsWith(k),k))}));
  const mx=Math.max(1,...rows.flatMap(r=>[r.i,r.g]));
  return head('Panel','Así va tu negocio hoy.')+`
  <div class="hero"><span>Capital actual</span><b>${m(cap)}</b><small>Capital inicial ${m(S.cfg.cap)} ${r.net<0?'−':'+'} ${gp(r.net).toLowerCase()} neta ${m(Math.abs(r.net))} · Caja estimada ${m(S.cfg.cap+r.net+r.dep-r.iv)}</small></div>
  <div class="grid">
   <div class="k"><span>Ingresos (dinero de tus ventas)</span><b>${m(t.ing)}</b></div>
   <div class="k"><span>Gastado en insumos</span><b>${m(t.cos)}</b></div>
   <div class="k"><span>Gastos generales</span><b>${m(r.gas)}</b></div>
   <div class="k"><span>Invertido en equipos</span><b>${m(iv)}</b></div><div class="k"><span>${gp(r.net)} neta</span><b class="${cls(r.net)}">${m(Math.abs(r.net))}</b></div></div>
  <div class="card tw"><h3>Estado de resultados</h3>${edr(r)}</div>
  <div class="card"><h3>Ingresos y gastos por mes</h3>${rows.length?`<div class="bars-w">${rows.map(r=>`<div class="bc"><div class="bars"><i class="b1" style="height:${r.i/mx*100}%" title="Ingresos ${m(r.i)}"></i><i class="b2" style="height:${r.g/mx*100}%" title="Gastos ${m(r.g)}"></i></div><span>${mesN(r.k)}</span></div>`).join('')}</div><div class="lg"><span><i class="b1"></i>Ingresos</span><span><i class="b2"></i>Gastos (insumos, generales y depreciación)</span></div>`:'<p class="empty">Registra tu primera venta para ver el gráfico.</p>'}</div>
  <div class="card"><h3>Configuración</h3><p class="mu" style="margin:0 0 14px">Solo estos 3 datos los pones tú. Todo lo demás (costos, precios, ganancias y capital) lo calcula la app. <b>Dinero con que empezaste</b>: lo que tenías al abrir el negocio (puede ser 0). <b>Cuánto quieres ganar</b>: con 100% cobras el doble de lo que te cuesta cada porción; con 50%, el costo más la mitad. <b>Moneda</b>: el símbolo, por ejemplo S/.</p><form class="row" data-f="cfg"><label>¿Con cuánto dinero empezaste?<input name="cap" type="number" step="any" value="${S.cfg.cap}" required></label><label>¿Cuánto quieres ganar? (% sobre el costo)<input name="mar" type="number" min="0" value="${S.cfg.mar}"></label><label>Pago por hora de decoración<input name="tar" type="number" step="any" min="0" value="${S.cfg.tar}"></label><label>Margen en pedidos especiales (%)<input name="mp" type="number" min="0" value="${S.cfg.mp}"></label><label>Moneda<input name="mon" value="${esc(S.cfg.mon)}" maxlength="4"></label><button class="p">Guardar</button></form></div>`;
};
V.insumos=()=>{
  const e=S.ins.find(i=>i.id===ui.eIns)||{id:'',n:'',c:'',u:'g',precio:''};
  return head('Insumos','Anota lo que pagas por cada ingrediente. La app calcula el costo por gramo, mililitro o unidad.')+`
  <div class="card"><h3>${e.id?'Editar insumo':'Nuevo insumo'}</h3><form class="row" data-f="ins"><input type="hidden" name="id" value="${e.id}">
   <label style="flex:2">Nombre<input name="n" value="${esc(e.n)}" required></label>
   <label>Cantidad comprada<input name="c" type="number" step="any" min="0.0001" value="${e.c}" required></label>
   <label>Unidad<select name="u">${Object.keys(U).map(u=>`<option ${u===e.u?'selected':''}>${u}</option>`).join('')}</select></label>
   <label>Precio pagado<input name="p" type="number" step="any" min="0" value="${e.precio}" required></label><label>Foto (opcional)<input name="foto" type="file" accept="image/*"></label>
   <button class="p">${e.id?'Guardar cambios':'Agregar'}</button>${e.id?'<button type="button" class="s" data-a="cancelIns">Cancelar</button>':''}</form></div>
  <div class="card tw">${S.ins.length?`<table><thead><tr><th>Insumo</th><th>Compra</th><th>Precio</th><th>Costo por unidad</th><th></th></tr></thead><tbody>${S.ins.map(i=>`<tr><td>${nm(i,esc(i.n))}</td><td>${i.c} ${i.u}</td><td>${m(i.precio)}</td><td>${S.cfg.mon} ${cb(i).toFixed(4)} / ${U[i.u][1]}</td><td><button class="l" data-a="editIns" data-id="${i.id}">Editar</button><button class="l" data-a="delIns" data-id="${i.id}">Eliminar</button></td></tr>`).join('')}</tbody></table>`:'<p class="empty">Aún no tienes insumos. Agrega el primero arriba.</p>'}</div>`;
};
V.postres=()=>head('Mis postres','Haz clic en un postre para ver ingredientes y preparación.')+`
  <p><button class="p" data-a="newPos">Nuevo postre</button></p>

};
function simUpd(){
  let I=0,C=0;
  S.pos.forEach(p=>{const q=+(ui.sim[p.id]??5)||0,c=calc(p),i=q*c.precio,k=q*c.porc;I+=i;C+=k;
    if($('#si'+p.id)){$('#si'+p.id).textContent=m(i);$('#sc'+p.id).textContent=m(k);$('#sg'+p.id).textContent=m(i-k)}});
  if($('#sTi')){$('#sTi').textContent=m(I);$('#sTc').textContent=m(C);$('#sTg').textContent=m(I-C)}
}

  const p0=S.pos[0],v=[...S.ven].sort((a,b)=>b.f.localeCompare(a.f)).slice(0,60);

  <div class="card tw">${v.length?`<table><thead><tr><th>Fecha</th><th>Postre</th><th>Cant.</th><th>Precio</th><th>Ingreso</th><th>Costo insumos</th><th>Ganancia</th><th></th></tr></thead><tbody>${v.map(x=>{const i=x.c*x.pr,k=x.c*x.cu;return`<tr><td>${fd8(x.f)}</td><td>${nm(pp(x.p),esc(pp(x.p).n))}</td><td>${x.c}</td><td>${m(x.pr)}</td><td>${m(i)}</td><td>${m(k)}</td><td class="${cls(i-k)}">${m(i-k)}</td><td><button class="l" data-a="delVen" data-id="${x.id}">Eliminar</button></td></tr>`}).join('')}</tbody></table>`:'<p class="empty">Sin ventas registradas todavía.</p>'}</div>`;

V.inv=()=>{
  const v=[...S.inv].sort((a,b)=>b.f.localeCompare(a.f));
  return head('Inversiones','Equipos y activos que compraste: vitrinas, enfriador, batidora y más. Se reparten mes a mes (depreciación) para no distorsionar tu ganancia.')+`
  <div class="card"><h3>Nueva compra</h3><form class="row" data-f="inv"><label>Fecha<input name="f" type="date" value="${today()}" required></label><label style="flex:2">¿Qué compraste?<input name="n" required></label><label>Monto<input name="m" type="number" step="any" min="0" required></label><label>Foto (opcional)<input name="foto" type="file" accept="image/*"></label><label>Vida útil (meses)<input name="vu" type="number" min="1" value="36"></label><button class="p">Agregar</button></form></div>
  <div class="card tw">${v.length?`<table><thead><tr><th>Fecha</th><th>Descripción</th><th>Monto</th><th></th></tr></thead><tbody>${v.map(x=>`<tr><td>${fd8(x.f)}</td><td>${nm(x,esc(x.n))}</td><td>${m(x.m)}</td><td><button class="l" data-a="delInv" data-id="${x.id}">Eliminar</button></td></tr>`).join('')}</tbody><tfoot><tr><td colspan="2">Total invertido</td><td colspan="2">${m(invS(()=>1))}</td></tr></tfoot></table>`:'<p class="empty">Aún no registraste inversiones.</p>'}</div>`;
};
const pu=id=>S.pun.find(x=>x.id===id)||{n:'(eliminado)',k:0};
const pvpV=(p,k)=>Math.ceil(calc(p).porc/.92*(1+p.mar/100)/(1-k/100)*10-1e-9)/10;
const cotz=(p,por,h,ex,u)=>{const f=por/p.porc,C=f*calc(p).total*1.05+h*S.cfg.tar+ex;let P=C*(1+S.cfg.mp/100);if(u)P*=1.15;return{C,P:Math.ceil(P/5-1e-9)*5}};
const sel=(a,n,i)=>`<select name="${n}" id="${i||''}">${a.map(x=>`<option value="${x.id}">${esc(x.n)}</option>`).join('')}</select>`;
V.vit=()=>{const p0=S.pos[0],u0=S.pun[0],v=[...S.sal].sort((a,b)=>b.f.localeCompare(a.f));
return head('Vitrina (minimarket)','Lo que envías, lo que se vende y lo que se pierde. La comisión se descuenta antes de que el dinero entre a tus ventas.')+`
<div class="card"><h3>Puntos de venta</h3><form class="row" data-f="pun"><label style="flex:2">Nombre del minimarket<input name="n" required></label><label>Comisión que se queda (%)<input name="k" type="number" min="0" max="90" step="any" value="25" required></label><button class="p">Agregar</button></form>${S.pun.length?`<p class="mu" style="margin:10px 0 0">${S.pun.map(x=>`${esc(x.n)} (${x.k}%) <button class="l" data-a="delPun" data-id="${x.id}">quitar</button>`).join(' · ')}</p>`:''}</div>
<div class="card"><h3>Nueva salida a vitrina</h3>${p0&&u0?`<form class="row" data-f="sal"><label>Fecha<input name="f" type="date" value="${today()}" required></label><label>Punto${sel(S.pun,'pu','spu')}</label><label style="flex:2">Postre${sel(S.pos,'p','sp')}</label><label>Cantidad<input name="c" type="number" min="1" value="10" required></label><label>Precio al público<input name="pvp" id="spvp" type="number" step="any" min="0" value="${pvpV(p0,u0.k).toFixed(2)}" required></label><button class="p">Enviar</button></form><p class="mu" style="margin:10px 0 0">El precio sugerido ya cubre tu margen, la comisión y una merma esperada de 8%.</p>`:'<p class="empty">Primero agrega un minimarket y un postre.</p>'}</div>
<div class="card tw">${v.length?`<table><thead><tr><th>Fecha</th><th>Punto</th><th>Postre</th><th>Enviadas</th><th>Vendidas</th><th>Merma</th><th>Devueltas</th><th>En vitrina</th><th>Te pagan c/u</th><th></th></tr></thead><tbody>${v.map(x=>{const e=x.c-x.v-x.m-x.d;return`<tr><td>${fd8(x.f)}</td><td>${esc(pu(x.pu).n)}</td><td>${nm(pp(x.p),esc(pp(x.p).n))}</td><td>${x.c}</td><td>${x.v}</td><td>${x.m}</td><td>${x.d}</td><td><b>${e}</b></td><td>${m(x.pvp*(1-pu(x.pu).k/100))}</td><td>${e>0?`<button class="l" data-a="liq" data-id="${x.id}">Liquidar</button>`:''}<button class="l" data-a="delSal" data-id="${x.id}">Eliminar</button></td></tr>`}).join('')}</tbody></table>`:'<p class="empty">Sin envíos todavía.</p>'}</div>`};
function liq(id){const s=S.sal.find(x=>x.id===id),e=s.c-s.v-s.m-s.d;
dlg.innerHTML=`<div class="dh"><h2>Liquidar vitrina</h2><button class="x" data-a="close" aria-label="Cerrar">✕</button></div><p class="mu">${esc(pp(s.p).n)} · ${esc(pu(s.pu).n)} · quedan ${e} en vitrina · te pagan ${m(s.pvp*(1-pu(s.pu).k/100))} por unidad</p><form data-f="liq" class="row"><input type="hidden" name="id" value="${id}"><label>Vendidas<input name="v" type="number" min="0" max="${e}" value="0"></label><label>Merma (vencidas o dañadas)<input name="mm" type="number" min="0" max="${e}" value="0"></label><label>Devueltas<input name="d" type="number" min="0" max="${e}" value="0"></label><button class="p">Guardar</button></form>`;dlg.showModal()}
const pagado=x=>x.pag.reduce((a,b)=>a+b.m,0);
V.ped=()=>{const p0=S.pos[0],v=[...S.ped].sort((a,b)=>(a.est==='ENTREGADO')-(b.est==='ENTREGADO')||a.fe.localeCompare(b.fe)),ab=v.filter(x=>x.est!=='ENTREGADO');
return head('Pedidos especiales','Tortas y encargos con fecha de entrega. El cotizador calcula el precio sugerido.')+`
<div class="grid"><div class="k"><span>Anticipos de clientes (aún no es ingreso)</span><b>${m(ab.reduce((a,x)=>a+pagado(x),0))}</b></div><div class="k"><span>Por cobrar</span><b>${m(ab.reduce((a,x)=>a+x.pf-pagado(x),0))}</b></div><div class="k"><span>Pedidos pendientes</span><b>${ab.length}</b></div></div>
<div class="card"><h3>Nuevo pedido</h3>${p0?`<form class="row" data-f="ped"><label style="flex:2">Cliente<input name="cl" required></label><label>Entrega<input name="fe" type="datetime-local" value="${today()}T12:00" required></label><label style="flex:2">Postre base${sel(S.pos,'p')}</label><label>Porciones<input name="por" type="number" min="1" value="12" required></label><label>Horas de decoración<input name="h" type="number" step="any" min="0" value="1"></label><label>Empaque y toppers (monto)<input name="ex" type="number" step="any" min="0" value="0"></label><label style="flex:none;flex-direction:row;align-items:center"><input type="checkbox" name="u" style="width:auto"> Urgente</label><label>Precio final (vacío = sugerido)<input name="pf" type="number" step="any" min="0"></label><button class="p">Guardar pedido</button></form><p id="cot" style="margin:12px 0 0"></p>`:'<p class="empty">Primero crea un postre.</p>'}</div>
<div class="card tw">${v.length?`<table><thead><tr><th>Entrega</th><th>Cliente</th><th>Pedido</th><th>Precio</th><th>Pagado</th><th>Saldo</th><th>Pago</th><th>Estado</th><th></th></tr></thead><tbody>${v.map(x=>{const g=pagado(x),pg=g<=0?'Pendiente':g<x.pf?'Adelanto':'Pagado',cr=x.est!=='ENTREGADO'&&x.pf-g>0&&new Date(x.fe)-Date.now()<1728e5;return`<tr><td>${x.fe.replace('T',' ')}${cr?' ⚠':''}</td><td>${esc(x.cl)}</td><td>${esc(pp(x.p).n)} × ${x.por}</td><td>${m(x.pf)}</td><td>${m(g)}</td><td>${m(x.pf-g)}</td><td>${pg}</td><td>${x.est==='ENTREGADO'?'Entregado':x.est==='CONFIRMADO'?'Confirmado':'Cotizado'}</td><td>${x.est==='COTIZADO'?`<button class="l" data-a="conf" data-id="${x.id}">Confirmar</button>`:''}${x.est!=='ENTREGADO'?`<button class="l" data-a="pagoD" data-id="${x.id}">Cobrar</button><button class="l" data-a="ent" data-id="${x.id}">Entregar</button>`:''}<button class="l" data-a="delPed" data-id="${x.id}">Eliminar</button></td></tr>`}).join('')}</tbody></table>`:'<p class="empty">Sin pedidos todavía.</p>'}</div>`};
function cotUpd(){const f=$('[data-f=ped]');if(!f)return;const d=Object.fromEntries(new FormData(f)),p=S.pos.find(x=>x.id===d.p);if(!p)return;const q=cotz(p,+d.por\vert{}\vert{}0,+d.h\vert{}\vert{}0,+d.ex\vert{}\vert{}0,!!d.u);$('#cot').innerHTML=`Costo del pedido ${m(q.C)} · Precio sugerido <b>${m(q.P)}</b> · Ganancia ${m(q.P-q.C)}`}
function pagoD(id){const x=S.ped.find(y=>y.id===id);dlg.innerHTML=`<div class="dh"><h2>Registrar cobro</h2><button class="x" data-a="close" aria-label="Cerrar">✕</button></div><p class="mu">${esc(x.cl)} · saldo ${m(x.pf-pagado(x))}</p><form data-f="pago" class="row"><input type="hidden" name="id" value="${id}"><label>Monto cobrado<input name="m" type="number" step="any" min="0.01" value="${(x.pf-pagado(x)).toFixed(2)}" required></label><button class="p">Guardar</button></form>`;dlg.showModal()}
V.comp=()=>{const a=new Date();a.setDate(a.getDate()-((a.getDay()+6)%7));const b=new Date(a);b.setDate(a.getDate()+6);ui.ci=ui.ci||a.toISOString().slice(0,10);ui.cf=ui.cf||b.toISOString().slice(0,10);
const need={},add=(id,q)=>{const p=S.pos.find(x=>x.id===id);if(p)p.ings.forEach(i=>need[i.i]=(need[i.i]||0)+i.c*q)},lot={};
S.sal.filter(x=>x.f>=ui.ci&&x.f<=ui.cf&&x.v+x.m+x.d===0).forEach(x=>lot[x.p]=(lot[x.p]||0)+x.c);
Object.entries(lot).forEach(([id,q])=>add(id,Math.ceil(q/pp(id).porc)));
S.ped.filter(x=>x.est==='CONFIRMADO'&&x.fe.slice(0,10)>=ui.ci&&x.fe.slice(0,10)<=ui.cf).forEach(x=>add(x.p,x.por/pp(x.p).porc));
const rows=Object.entries(need).map(([id,q])=>{const i=ins(id);if(!i)return null;const rq=q*1.03,n=Math.ceil(rq/(i.c*U[i.u][0])-1e-9);return{i,rq,n,c:n*i.precio}}).filter(Boolean),T=rows.reduce((a,x)=>a+x.c,0);
return head('Planificador de compras','La lista de insumos que necesitas para lo que enviarás a vitrina y los pedidos confirmados de la semana.')+`
<div class="card"><form class="row"><label style="max-width:200px">Desde<input type="date" id="ci" value="${ui.ci}"></label><label style="max-width:200px">Hasta<input type="date" id="cf" value="${ui.cf}"></label></form></div>
<div class="card tw">${rows.length?`<table><thead><tr><th>Insumo</th><th>Necesitas</th><th>Comprar</th><th>Costo</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${nm(x.i,esc(x.i.n))}</td><td>${Math.round(x.rq)} ${U[x.i.u][1]}</td><td>${x.n} × ${x.i.c} ${x.i.u}</td><td>${m(x.c)}</td></tr>`).join('')}</tbody><tfoot><tr><td colspan="3">Presupuesto de compras</td><td>${m(T)}</td></tr></tfoot></table>`:'<p class="empty">No hay envíos a vitrina sin liquidar ni pedidos confirmados en esas fechas.</p>'}<p class="mu" style="margin-bottom:0">Incluye 3% extra por desperdicio. Esta versión no descuenta lo que ya tienes en bodega.</p></div>`};
const peH=(k,r)=>{const vs=S.ven.filter(v=>v.f.startsWith(k)),b=vs.length?vs:S.ven,u=b.reduce((a,v)=>a+v.c,0)||1,mc=b.reduce((a,v)=>a+v.c*(v.pr-v.cu),0)/u,pr=b.reduce((a,v)=>a+v.c*v.pr,0)/u,cf=S.gas.filter(x=>x.f.startsWith(k)&&x.tipo!=='VARIABLE').reduce((a,x)=>a+x.m,0)+r.dep,vend=vs.reduce((a,v)=>a+v.c,0);
if(mc<=0)return'<div class="card"><h3>Punto de equilibrio</h3><p class="neg">No alcanzable: revisa tus precios o comisiones.</p></div>';
const pe=Math.max(1,Math.ceil(cf/mc));return`<div class="card"><h3>Punto de equilibrio</h3><div class="grid" style="margin:0"><div class="k"><span>Costos fijos del mes</span><b>${m(cf)}</b></div><div class="k"><span>Ganancia promedio por postre</span><b>${m(mc)}</b></div><div class="k"><span>Debes vender para no perder</span><b>${pe} porciones</b></div><div class="k"><span>Ventas reales este mes</span><b class="${vend>=pe?'pos':'neg'}">${vend} porciones</b></div></div></div>`};
V.gas=()=>{const v=[...S.gas].sort((a,b)=>b.f.localeCompare(a.f));
return head('Gastos generales','Alquiler, luz, agua, internet, transporte y otros gastos del negocio.')+`
<div class="card"><h3>Nuevo gasto</h3><form class="row" data-f="gas"><label>Fecha<input name="f" type="date" value="${today()}" required></label><label style="flex:2">Descripción<input name="n" required></label><label>Monto<input name="m" type="number" step="any" min="0" required></label><label>Tipo<select name="tipo"><option value="FIJO">Fijo (alquiler, servicios)</option><option value="VARIABLE">Variable (transporte, imprevistos)</option></select></label><button class="p">Agregar</button></form></div>
<div class="card tw">${v.length?`<table><thead><tr><th>Fecha</th><th>Descripción</th><th>Tipo</th><th>Monto</th><th></th></tr></thead><tbody>${v.map(x=>`<tr><td>${fd8(x.f)}</td><td>${esc(x.n)}</td><td>${x.tipo}</td><td>${m(x.m)}</td><td><button class="l" data-a="delGas" data-id="${x.id}">Eliminar</button></td></tr>`).join('')}</tbody></table>`:'<p class="empty">Sin gastos registrados.</p>'}</div>`};
V.res=()=>{const k=ui.mes,r=R(x=>x.f.startsWith(k),k);
return head('Resumen mensual','Selecciona un mes para ver tu balance detallado.')+`
<div class="card"><form class="row"><label style="max-width:200px">Mes<input type="month" id="rmes" value="${k}"></label></form></div>
<div class="card tw"><h3>Estado de resultados de ${mesN(k)}</h3>${edr(r)}</div>${peH(k,r)}`};
function renderNav(){$('#nav').innerHTML=T.map(([id,t])=>`<button class="${id===ui.tab?'on':''}" data-tab="${id}">${t}</button>`).join('')}
function render(){renderNav();$('#main').innerHTML=V[ui.tab]();if(ui.tab==='costos')simUpd();if(ui.tab==='ped')cotUpd()}
document.addEventListener('click',e=>{
  const b=e.target.closest('button, [data-tab]');if(!b)return;
  if(b.dataset.tab){ui.tab=b.dataset.tab;render();return}
  const a=b.dataset.a,id=b.dataset.id;
  if(a==='close')dlg.close();
  if(a==='editIns'){ui.eIns=id;render()}
  if(a==='cancelIns'){ui.eIns=null;render()}
  if(a==='delIns'){S.ins=S.ins.filter(i=>i.id!==id);save();render()}
  if(a==='delInv'){S.inv=S.inv.filter(i=>i.id!==id);save();render()}
  if(a==='delGas'){S.gas=S.gas.filter(i=>i.id!==id);save();render()}
  if(a==='delVen'){S.ven=S.ven.filter(i=>i.id!==id);save();render()}
  if(a==='delPun'){S.pun=S.pun.filter(i=>i.id!==id);save();render()}
  if(a==='delSal'){S.sal=S.sal.filter(i=>i.id!==id);save();render()}
  if(a==='delPed'){S.ped=S.ped.filter(i=>i.id!==id);save();render()}
  if(a==='newPos')openPos();
  if(a==='ver')openPos(id);
  if(a==='liq')liq(id);
  if(a==='pagoD')pagoD(id);
  if(a==='conf'){const p=S.ped.find(x=>x.id===id);if(p){p.est='CONFIRMADO';save();render()}}
  if(a==='ent'){const p=S.ped.find(x=>x.id===id);if(p){p.est='ENTREGADO';S.ven.push({id:uid(),f:today(),p:p.p,c:p.por,pr:p.pf/p.por,cu:calc(pp(p.p)).porc});save();render()}}
});
document.addEventListener('input',e=>{
  if(e.target.dataset.sim){ui.sim[e.target.dataset.sim]=e.target.value;simUpd()}
  if(e.target.id==='vp'){const p=S.pos.find(x=>x.id===e.target.value);if(p&&$('#vpr'))$('#vpr').value=calc(p).precio.toFixed(2)}
  if(e.target.id==='sp'||e.target.id==='spu'){const p=S.pos.find(x=>x.id===$('#sp')?.value),u=S.pun.find(x=>x.id===$('#spu')?.value);if(p&&u&&$('#spvp'))$('#spvp').value=pvpV(p,u.k).toFixed(2)}
  if(e.target.closest('[data-f=ped]'))cotUpd();
  if(e.target.id==='rmes'){ui.mes=e.target.value;render()}
  if(e.target.id==='ci'){ui.ci=e.target.value;render()}
  if(e.target.id==='cf'){ui.cf=e.target.value;render()}
});
const readF=f=>new Promise(r=>{if(!f)return r('');const rd=new FileReader();rd.onload=()=>r(rd.result);rd.readAsDataURL(f)});
document.addEventListener('submit',async e=>{
  e.preventDefault();const form=e.target,f=form.dataset.f,d=Object.fromEntries(new FormData(form));
  if(f==='cfg'){S.cfg.cap=+d.cap||0;S.cfg.mar=+d.mar||0;S.cfg.tar=+d.tar||0;S.cfg.mp=+d.mp||0;S.cfg.mon=d.mon||'S/';save();render()}
  if(f==='ins'){const img=form.foto?.files[0]?await readF(form.foto.files[0]):(S.ins.find(i=>i.id===d.id)?.img||'');if(d.id){const i=S.ins.find(x=>x.id===d.id);Object.assign(i,{n:d.n,c:+d.c,u:d.u,precio:+d.p,img});ui.eIns=null}else S.ins.push({id:uid(),n:d.n,c:+d.c,u:d.u,precio:+d.p,img});save();render()}
  if(f==='inv'){const img=form.foto?.files[0]?await readF(form.foto.files[0]):'';S.inv.push({id:uid(),f:d.f,n:d.n,m:+d.m,vu:+d.vu||36,img});save();render()}
  if(f==='gas'){S.gas.push({id:uid(),f:d.f,n:d.n,m:+d.m,tipo:d.tipo});save();render()}
  if(f==='ven'){const p=S.pos.find(x=>x.id===d.p);S.ven.push({id:uid(),f:d.f,p:d.p,c:+d.c,pr:+d.pr,cu:calc(p).porc});save();render()}
  if(f==='pun'){S.pun.push({id:uid(),n:d.n,k:+d.k});save();render()}
  if(f==='sal'){S.sal.push({id:uid(),f:d.f,pu:d.pu,p:d.p,c:+d.c,pvp:+d.pvp,v:0,m:0,d:0});save();render()}
  if(f==='liq'){const s=S.sal.find(x=>x.id===d.id),v=+d.v||0,mm=+d.mm||0,dev=+d.d||0;s.v+=v;s.m+=mm;s.d+=dev;if(v>0)S.ven.push({id:uid(),f:today(),p:s.p,c:v,pr:s.pvp*(1-pu(s.pu).k/100),cu:calc(pp(s.p)).porc,com:s.pvp*(pu(s.pu).k/100)});if(mm>0)S.mer.push({id:uid(),f:today(),p:s.p,c:mm,cos:mm*calc(pp(s.p)).porc});save();dlg.close();render()}
  if(f==='ped'){const p=S.pos.find(x=>x.id===d.p),q=cotz(p,+d.por||0,+d.h||0,+d.ex||0,!!d.u),pf=+d.pf||q.P;S.ped.push({id:uid(),cl:d.cl,fe:d.fe,p:d.p,por:+d.por,h:+d.h,ex:+d.ex,u:!!d.u,pf,est:'COTIZADO',pag:[]});save();render()}
  if(f==='pago'){const p=S.ped.find(x=>x.id===d.id);p.pag.push({f:today(),m:+d.m});if(p.est==='COTIZADO')p.est='CONFIRMADO';save();dlg.close();render()}
  if(f==='pos'){
    const ings=[];form.querySelectorAll('.ir').forEach(r=>{const i=r.querySelector('select').value,c=+r.querySelector('input').value||0;if(c>0)ings.push({i,c})});
    const img=form.foto?.files[0]?await readF(form.foto.files[0]):(S.pos.find(x=>x.id===d.id)?.img||'');
    const data={n:d.n,porc:+d.porc||1,emp:+d.emp||0,otros:+d.otros||0,mar:+d.mar||0,precio:+d.precio||0,pasos:d.pasos,ings,img};
    if(d.id){const p=S.pos.find(x=>x.id===d.id);Object.assign(p,data)}else S.pos.push({id:uid(),...data});
    save();dlg.close();render();
  }
});
function openPos(id){
  const p=S.pos.find(x=>x.id===id)||{id:'',n:'',porc:8,emp:0.3,otros:2,mar:S.cfg.mar,precio:0,pasos:'',ings:[{i:S.ins[0]?.id||'',c:100}],img:''};
  const c=calc(p);
  dlg.innerHTML=`
  <div class="dh"><h2>${p.id?esc(p.n):'Nuevo postre'}</h2><button class="x" data-a="close" aria-label="Cerrar">✕</button></div>
  <form data-f="pos">
    <input type="hidden" name="id" value="${p.id}">
    <div class="row">
      <label style="flex:2">Nombre del postre<input name="n" value="${esc(p.n)}" required></label>
      <label>Porciones por receta<input name="porc" type="number" min="1" value="${p.porc}" required></label>
      <label>Foto (opcional)<input name="foto" type="file" accept="image/*"></label>
    </div>
    <h3>Ingredientes</h3>
    <div id="il">${p.ings.map((r,idx)=>irH(r,idx)).join('')}</div>
    <button type="button" class="s" id="addI" style="margin-bottom:12px">+ Agregar ingrediente</button>
    <div class="row">
      <label>Empaque por porción<input name="emp" type="number" step="any" min="0" value="${p.emp}"></label>
      <label>Gas/mano de obra (por receta)<input name="otros" type="number" step="any" min="0" value="${p.otros}"></label>
      <label>Margen de ganancia (%)<input name="mar" type="number" min="0" value="${p.mar}"></label>
      <label>Precio de venta manual (opcional)<input name="precio" type="number" step="any" min="0" value="${p.precio||''}"></label>
    </div>
    <h3>Preparación</h3>
    <textarea name="pasos" rows="4" placeholder="Pasos para preparar este postre...">${esc(p.pasos)}</textarea>
    ${p.id?`<div class="sum">
      <span>Costo de insumos:</span><b>${m(c.insumos)}</b>
      <span>Costo total receta:</span><b>${m(c.total)}</b>
      <span>Costo por porción:</span><b>${m(c.porc)}</b>
      <span>Precio ideal por porción:</span><b>${m(c.ideal)}</b>
      <span>Precio cobrado:</span><b>${m(c.precio)}</b>
      <span>Ganancia por porción:</span><b class="${cls(c.gan)}">${m(c.gan)}</b>
    </div>`:''}
    <div class="act">
      ${p.id?`<button type="button" class="dg" id="delP" data-id="${p.id}">Eliminar postre</button>`:''}
      <button class="p">Guardar postre</button>
    </div>
  </form>`;
  dlg.showModal();
  $('#addI').onclick=()=>{const div=document.createElement('div');div.innerHTML=irH({i:S.ins[0]?.id||'',c:100});$('#il').appendChild(div.firstElementChild)};
  dlg.onclick=e=>{
    if(e.target.classList.contains('delI'))e.target.closest('.ir').remove();
    if(e.target.id==='delP'){S.pos=S.pos.filter(x=>x.id!==e.target.dataset.id);save();dlg.close();render()}
  };
}
function irH(r={}){return`<div class="ir"><select>${S.ins.map(i=>`<option value="${i.id}" ${i.id===r.i?'selected':''}>${esc(i.n)} (${i.c}${i.u})</option>`).join('')}</select><input type="number" step="any" min="0" value="${r.c||''}" placeholder="Cant." required><button type="button" class="x delI">✕</button></div>`}
render();
</script>
</body>
</html>
