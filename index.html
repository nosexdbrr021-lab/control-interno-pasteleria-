<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Belu Pastelería</title>

<!-- CONEXION PWA -->
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#ffffff">
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function() {
      navigator.serviceWorker.register('/pwabuilder-sw.js')
        .then(function(reg) { console.log('Service Worker registrado:', reg); })
        .catch(function(err) { console.warn('Error en Service Worker:', err); });
    });
  }
</script>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=DM+Sans:wght@400;500;700&display=swap">
<style>
:root{--bg:#F9F5F0;--card:#fff;--ch:#2A1A1E;--chx:#F3EAE2;--ro:#8E3A52;--rs:#F5E6E9;--ln:#E6DACF;--tx:#2A1A1E;--mu:#7C6B66;--ok:#2F7D5B;--no:#B3382C;--au:#B8935A;box-sizing:border-box}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1A1114;--card:#261A1E;--ch:#EBDCD2;--chx:#33252A;--ro:#D98BA3;--rs:#432733;--ln:#3F2F33;--tx:#F5ECE7;--mu:#B8A5A0;--ok:#6FCF9F;--no:#F08A7E;--au:#D4B27A}}
:root[data-theme=dark]{--bg:#1A1114;--card:#261A1E;--ch:#EBDCD2;--chx:#33252A;--ro:#D98BA3;--rs:#432733;--ln:#3F2F33;--tx:#F5ECE7;--mu:#B8A5A0;--ok:#6FCF9F;--no:#F08A7E;--au:#D4B27A}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 "DM Sans",system-ui,sans-serif}
h1,h2,h3{font-family:"Cormorant Garamond",Georgia,serif;margin:0;color:var(--ch)}
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
aside{background:var(--ch);padding:26px 16px;position:sticky;top:0;height:100vh}
aside h1{color:var(--bg);font-size:46px;font-style:italic;line-height:1;padding:0 10px}aside p.br{color:var(--au);opacity:1;letter-spacing:.34em;font-size:12px;margin:4px 10px 8px}
aside p{color:var(--bg);opacity:.65;margin:0 10px 22px;font-size:13px}
#nav{display:flex;flex-direction:column;gap:2px}
#nav button{background:none;border:0;color:var(--bg);opacity:.75;text-align:left;padding:10px 12px;border-radius:8px;font:inherit;cursor:pointer}
#nav button:hover{opacity:1;background:#ffffff14}
#nav button.on{background:var(--ro);color:#fff;opacity:1;font-weight:700}
main{padding:30px clamp(16px,4vw,44px);max-width:1100px;width:100%}
main>h2{font-size:38px;margin-bottom:4px}main>h2:after{content:"";display:block;width:44px;height:2px;background:var(--au);margin-top:6px}
.sub{color:var(--mu);margin:0 0 22px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:18px;margin-bottom:18px}
.card h3{font-size:18px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:18px}
.k{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:14px 16px}
.k span{color:var(--mu);font-size:13px}.k b{display:block;font-size:28px;font-family:"Cormorant Garamond",Georgia,serif;color:var(--ch);margin-top:2px}
.pos{color:var(--ok)!important}.neg{color:var(--no)!important}
.hero{background:var(--ch);color:var(--bg);border-radius:14px;padding:26px;margin-bottom:18px;border-top:3px solid var(--au)}
.hero span{opacity:.75}.hero b{display:block;font:700 58px "Cormorant Garamond",Georgia,serif;margin:2px 0 6px}
.hero small{opacity:.7}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:9px 10px;text-align:right;border-bottom:1px solid var(--ln);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--mu);font-weight:500;font-size:13px}
tfoot td{font-weight:700;border-bottom:0;background:var(--chx)}
form.row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
label{display:flex;flex-direction:column;font-size:13px;color:var(--mu);gap:3px;flex:1;min-width:120px}
input,select,textarea{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--ln);border-radius:8px;padding:8px 10px;width:100%}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--ro);outline-offset:1px}
button.p,button.s,button.dg{font:inherit;font-weight:500;border-radius:8px;padding:9px 16px;cursor:pointer;border:1px solid var(--ro)}
button.p{background:var(--ro);color:#fff}
button.s{background:none;color:var(--ro)}
button.dg{background:none;color:var(--no);border-color:var(--no)}
button.l{background:none;border:0;color:var(--ro);cursor:pointer;font:inherit;padding:2px 6px}
button.x{background:none;border:0;color:var(--mu);cursor:pointer;font-size:16px;padding:4px 8px}
.pl{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.pc{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:16px;text-align:left;cursor:pointer;font:inherit;color:var(--tx)}
.pc:hover{border-color:var(--ro)}
.pc h3{font-size:19px;margin-bottom:6px}.pc small{color:var(--mu);display:block}
.pc em{font-style:normal;color:var(--ro);font-weight:700;font-size:18px}
.mu{color:var(--mu)}
dialog{border:1px solid var(--ln);border-radius:14px;background:var(--card);color:var(--tx);width:min(640px,94vw);max-height:90vh;padding:22px}
dialog::backdrop{background:#0008}
.dh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
dialog h3{margin:16px 0 6px;font-size:16px}
.sum{background:var(--rs);border-radius:10px;padding:12px 14px;margin-top:14px;display:grid;grid-template-columns:1fr auto;gap:3px 16px}
.sum b:nth-child(even){text-align:right}
.act{display:flex;gap:10px;margin-top:16px;justify-content:flex-end}
.ir{display:flex;gap:8px;margin-bottom:8px;align-items:center}.ir select{flex:2}.ir input{flex:1}
.bars-w{display:flex;gap:16px;align-items:flex-end;height:170px;padding-top:6px}
.bc{flex:1;display:flex;flex-direction:column;align-items:center;height:100%;justify-content:flex-end;gap:6px}
.bars{display:flex;gap:4px;align-items:flex-end;height:100%;width:100%;justify-content:center}
.bars i{width:min(26px,40%);border-radius:4px 4px 0 0;min-height:2px}
.b1{background:var(--ro)}.b2{background:var(--ch)}
.bc span{font-size:12px;color:var(--mu)}
.lg{font-size:13px;color:var(--mu);display:flex;gap:14px;margin-top:10px}.lg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px}
.empty{color:var(--mu);padding:14px 0}
@media(max-width:760px){.app{grid-template-columns:1fr}aside{position:static;height:auto;padding:14px 10px}aside p:not(.br){display:none}#nav{flex-direction:row;overflow-x:auto}#nav button{white-space:nowrap}.hero b{font-size:34px}}
.card,.k,.pc{box-shadow:0 1px 2px #2a1a1e0d,0 8px 20px #2a1a1e0a}
.ph{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:10px;background:var(--chx);font-size:19px;overflow:hidden;flex:none}
.ph img{width:100%;height:100%;object-fit:cover}.ph.lg{width:60px;height:60px;font-size:28px;border-radius:12px}
.nm{display:inline-flex;align-items:center;gap:10px;text-align:left}
.er td{padding:9px 10px}.er .t td{font-weight:700;background:var(--chx)}
input[type=file]{padding:6px}
</style>
</head>
<body>
<div class="app">
<aside><h1>Belu</h1><p class="br">Pastelería</p><p>Costos, ventas y capital en un solo lugar</p><nav id="nav"></nav></aside>
<main id="main"></main>
</div>
<dialog id="dlg"></dialog>

<script>
var KEY = 'dulcecuenta_v1';
var U = { g: [1, 'g'], kg: [1000, 'g'], ml: [1, 'ml'], L: [1000, 'ml'], un: [1, 'un'] };

function $(s) { return document.querySelector(s); }
var dlg = $('#dlg');

function uid() { return Math.random().toString(36).slice(2, 9); }
function esc(s) { return String(s || '').replace(/[&<>"']/g, function(c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function today() { return new Date().toISOString().slice(0, 10); }
function dd(o) { return new Date(Date.now() - o * 864e5).toISOString().slice(0, 10); }
function fd8(f) { return f.split('-').reverse().join('/'); }
function mesN(k) { return new Date(k + '-15').toLocaleDateString('es-PE', { month: 'short', year: '2-digit' }); }

var S;
try { S = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}

function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
function m(n) { return S.cfg.mon + ' ' + (+n).toFixed(2); }
function ins(id) { return S.ins.find(function(i) { return i.id === id; }); }
function cb(i) { return i.precio / (i.c * U[i.u][0]); }
function cls(n) { return n < 0 ? 'neg' : 'pos'; }

var EM = [
  [/tres leches|torta|keke|cake/i, '🍰'],
  [/leche/i, '🥛'],
  [/huevo/i, '🥚'],
  [/azúcar|azucar/i, '🍬'],
  [/harina/i, '🌾'],
  [/mantequilla/i, '🧈'],
  [/vainilla/i, '🌼'],
  [/polvo/i, '🧂'],
  [/crema|flan/i, '🍮'],
  [/vitrina/i, '🗄'],
  [/enfriador|refri|congel/i, '❄️'],
  [/batidora|licuadora|horno/i, '🥣']
];

function th(o, c) {
  c = c || '';
  var icon = '🧁';
  for (var i = 0; i < EM.length; i++) {
    if (EM[i][0].test(o.n)) { icon = EM[i][1]; break; }
  }
  return '<span class="ph ' + c + '">' + (o.img ? '<img src="' + o.img + '" alt="">' : icon) + '</span>';
}

function nm(o, t, c) { return '<span class="nm">' + th(o, c) + t + '</span>'; }
function pp(id) { return S.pos.find(function(p) { return p.id === id; }) || { n: '(eliminado)' }; }
function gp(n) { return n < 0 ? 'Pérdida' : 'Ganancia'; }
function mdif(a, b) { return (+a.slice(0, 4) - +b.slice(0, 4)) * 12 + (+a.slice(5) - +b.slice(5)); }

function dep(k) {
  return S.inv.reduce(function(a, x) {
    var v = x.vu || 36, q = x.m / v, n = mdif(k || today().slice(0, 7), x.f.slice(0, 7));
    return a + (k ? (n >= 0 && n < v ? q : 0) : Math.min(v, Math.max(0, n + 1)) * q);
  }, 0);
}

function R(f, k) {
  var t = tot(f);
  var g = S.gas.filter(f).reduce(function(a, x) { return a + x.m; }, 0);
  var mer = S.mer.filter(f).reduce(function(a, x) { return a + x.cos; }, 0);
  var d = dep(k);
  return Object.assign({}, t, { gas: g, mer: mer, dep: d, iv: invS(f), net: t.gan - mer - g - d });
}

function edr(r) {
  return '<table class="er"><tbody><tr><td>Ingresos por ventas</td><td>' + m(r.ing) + '</td></tr><tr><td>(−) Gasto en insumos</td><td>' + m(r.cos) + '</td></tr><tr><td>(−) Mermas de vitrina</td><td>' + m(r.mer) + '</td></tr><tr class="t"><td>Utilidad bruta</td><td class="' + cls(r.gan - r.mer) + '">' + m(r.gan - r.mer) + '</td></tr><tr><td>(−) Gastos generales</td><td>' + m(r.gas) + '</td></tr><tr class="t"><td>Utilidad operativa</td><td class="' + cls(r.gan - r.mer - r.gas) + '">' + m(r.gan - r.mer - r.gas) + '</td></tr><tr><td>(−) Depreciación</td><td>' + m(r.dep) + '</td></tr><tr class="t"><td>Resultado neto: ' + gp(r.net) + '</td><td class="' + cls(r.net) + '">' + m(Math.abs(r.net)) + '</td></tr></tbody></table>';
}

function calc(p) {
  var insumos = p.ings.reduce(function(a, r) { var i = ins(r.i); return a + (i ? cb(i) * r.c : 0); }, 0);
  var total = insumos + (+p.otros || 0) + (p.porc * (p.emp || 0));
  var porc = total / p.porc;
  var ideal = Math.ceil(porc * (1 + (p.mar || 0) / 100) * 10 - 1e-9) / 10;
  var precio = p.precio > 0 ? p.precio : ideal;
  return { insumos: insumos, total: total, porc: porc, ideal: ideal, precio: precio, gan: precio - porc };
}

function seed() {
  function I(n, c, u, precio) { return { id: uid(), n: n, c: c, u: u, precio: precio }; }
  var li = [I('Leche evaporada', 400, 'g', 4.5), I('Leche condensada', 393, 'g', 6.5), I('Leche fresca', 1, 'L', 4.8), I('Huevos', 30, 'un', 15), I('Azúcar', 1, 'kg', 4.2), I('Harina', 1, 'kg', 4), I('Mantequilla', 200, 'g', 8), I('Esencia de vainilla', 120, 'ml', 6), I('Polvo de hornear', 100, 'g', 5)];
  function g(n) { return li.find(function(i) { return i.n === n; }).id; }
  function P(n, porc, l, pasos) { return { id: uid(), n: n, porc: porc, ings: l.map(function(x) { return { i: g(x[0]), c: x[1] }; }), pasos: pasos, emp: 0.3, otros: 2, mar: 100, precio: 0 }; }
  var po = [
    P('Crema volteada', 8, [['Huevos', 6], ['Leche evaporada', 400], ['Leche condensada', 393], ['Leche fresca', 250], ['Azúcar', 150], ['Esencia de vainilla', 5]], 'Caramelo y horneado a baño maría.'),
    P('Tres leches', 10, [['Huevos', 6], ['Harina', 200], ['Azúcar', 200], ['Leche evaporada', 400], ['Leche condensada', 393], ['Leche fresca', 250], ['Polvo de hornear', 8], ['Esencia de vainilla', 5]], 'Bizcocho bañado en tres leches.'),
    P('Keke', 10, [['Harina', 300], ['Azúcar', 200], ['Huevos', 4], ['Mantequilla', 150], ['Leche fresca', 150], ['Polvo de hornear', 10], ['Esencia de vainilla', 5]], 'Mezclar y hornear a 180°C.')
  ];
  S = { cfg: { mon: 'S/', cap: 3000, mar: 100 }, ins: li, pos: po, ven: [], inv: [], gas: [] };
  save();
}

if (!S) seed();
S.gas = S.gas || []; S.cfg.mar = S.cfg.mar || 100;
S.pun = S.pun || []; S.sal = S.sal || []; S.mer = S.mer || []; S.ped = S.ped || [];

var ui = { tab: 'panel', mes: today().slice(0, 7), sim: {}, eIns: null };
var T = [['panel', 'Panel'], ['insumos', 'Insumos'], ['postres', 'Postres'], ['costos', 'Costos'], ['ventas', 'Ventas'], ['inv', 'Inversiones'], ['gas', 'Gastos generales']];

function tot(f) {
  var i = 0, c = 0;
  S.ven.filter(f).forEach(function(v) { i += v.c * v.pr; c += v.c * v.cu; });
  return { ing: i, cos: c, gan: i - c };
}
function invS(f) { return S.inv.filter(f).reduce(function(a, x) { return a + x.m; }, 0); }
function head(t, s) { return '<h2>' + t + '</h2><p class="sub">' + s + '</p>'; }

var V = {};
V.panel = function() {
  var t = tot(function() { return true; });
  var r = R(function() { return true; });
  return head('Panel', 'Resumen rápido de tu negocio.') +
    '<div class="hero"><span>Capital actual</span><b>' + m(S.cfg.cap + r.net) + '</b></div>' +
    '<div class="grid">' +
    '<div class="k"><span>Ventas</span><b>' + m(t.ing) + '</b></div>' +
    '<div class="k"><span>Insumos</span><b>' + m(t.cos) + '</b></div>' +
    '<div class="k"><span>Gastos</span><b>' + m(r.gas) + '</b></div>' +
    '<div class="k"><span>Ganancia Neta</span><b class="' + cls(r.net) + '">' + m(Math.abs(r.net)) + '</b></div></div>' +
    '<div class="card tw"><h3>Estado de Resultados</h3>' + edr(r) + '</div>';
};

V.insumos = function() {
  var e = S.ins.find(function(i) { return i.id === ui.eIns; }) || { id: '', n: '', c: '', u: 'g', precio: '' };
  return head('Insumos', 'Ingredientes y sus costos.') +
    '<div class="card"><h3>' + (e.id ? 'Editar' : 'Nuevo') + ' insumo</h3>' +
    '<form class="row" data-f="ins"><input type="hidden" name="id" value="' + e.id + '">' +
    '<label style="flex:2">Nombre<input name="n" value="' + esc(e.n) + '" required></label>' +
    '<label>Cantidad<input name="c" type="number" step="any" value="' + e.c + '" required></label>' +
    '<label>Unidad<select name="u">' + Object.keys(U).map(function(u) { return '<option ' + (u === e.u ? 'selected' : '') + '>' + u + '</option>'; }).join('') + '</select></label>' +
    '<label>Precio<input name="p" type="number" step="any" value="' + e.precio + '" required></label>' +
    '<button class="p">Guardar</button></form></div>' +
    '<div class="card tw"><table><thead><tr><th>Insumo</th><th>Cantidad</th><th>Precio</th><th>Acción</th></tr></thead><tbody>' +
    S.ins.map(function(i) { return '<tr><td>' + nm(i, esc(i.n)) + '</td><td>' + i.c + ' ' + i.u + '</td><td>' + m(i.precio) + '</td><td><button class="l" data-a="delIns" data-id="' + i.id + '">Eliminar</button></td></tr>'; }).join('') +
    '</tbody></table></div>';
};

V.postres = function() {
  return head('Postres', 'Tus recetas.') +
    '<div class="pl">' + S.pos.map(function(p) {
      var c = calc(p);
      return '<div class="pc"><span class="nm">' + th(p, 'lg') + '<h3>' + esc(p.n) + '</h3></span><p>Porción: ' + m(c.porc) + '</p><em>' + m(c.precio) + '</em></div>';
    }).join('') + '</div>';
};

V.costos = function() {
  return head('Costos', 'Análisis por producto.') +
    '<div class="card tw"><table><thead><tr><th>Postre</th><th>Costo/Porción</th><th>Precio Venta</th><th>Ganancia</th></tr></thead><tbody>' +
    S.pos.map(function(p) { var c = calc(p); return '<tr><td>' + nm(p, esc(p.n)) + '</td><td>' + m(c.porc) + '</td><td><b>' + m(c.precio) + '</b></td><td class="' + cls(c.gan) + '">' + m(c.gan) + '</td></tr>'; }).join('') +
    '</tbody></table></div>';
};

V.ventas = function() {
  return head('Ventas', 'Registro de ventas diarias.') +
    '<div class="card"><form class="row" data-f="ven">' +
    '<label>Fecha<input name="f" type="date" value="' + today() + '" required></label>' +
    '<label style="flex:2">Postre<select name="p">' + S.pos.map(function(p) { return '<option value="' + p.id + '">' + esc(p.n) + '</option>'; }).join('') + '</select></label>' +
    '<label>Cantidad<input name="c" type="number" value="1" min="1" required></label>' +
    '<label>Precio<input name="pr" type="number" step="any" value="' + calc(S.pos[0] || {}).precio + '" required></label>' +
    '<button class="p">Registrar Venta</button></form></div>';
};

V.inv = function() { return head('Inversiones', 'Maquinarias y equipos.'); };
V.gas = function() { return head('Gastos', 'Gastos operativos.'); };

function renderNav() {
  $('#nav').innerHTML = T.map(function(item) {
    return '<button class="' + (ui.tab === item[0] ? 'on' : '') + '" data-tab="' + item[0] + '">' + item[1] + '</button>';
  }).join('');
}

function render() {
  renderNav();
  $('#main').innerHTML = V[ui.tab] ? V[ui.tab]() : '';
}

document.addEventListener('click', function(e) {
  var b = e.target.closest('[data-tab],[data-a]');
  if (!b) return;
  if (b.dataset.tab) { ui.tab = b.dataset.tab; render(); return; }
  var a = b.dataset.a, id = b.dataset.id;
  if (a === 'delIns') { S.ins = S.ins.filter(function(i) { return i.id !== id; }); save(); render(); }
});

document.addEventListener('submit', function(e) {
  var f = e.target, d = Object.fromEntries(new FormData(f));
  if (f.dataset.f === 'ins') { S.ins.push({ id: uid(), n: d.n, c: +d.c, u: d.u, precio: +d.p }); save(); render(); }
  if (f.dataset.f === 'ven') { S.ven.push({ id: uid(), f: d.f, p: d.p, c: +d.c, pr: +d.pr, cu: calc(pp(d.p)).porc }); save(); render(); }
  e.preventDefault();
});

render();
</script>
</body>
</html>
